<!doctype html>
</footer>
</div>


<!-- modal -->
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
<div class="modal-card" role="document">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
<h3>Запись на занятие</h3>
<button class="close" onclick="closeModal()">✕</button>
</div>
<form id="contactForm" onsubmit="submitForm(event)">
<div class="field">
<label>Ваше имя</label>
<input type="text" id="name" required />
</div>
<div class="field">
<label>Телефон или email</label>
<input type="text" id="contact" required />
</div>
<div class="field">
<label>Кратко — цель занятия</label>
<textarea id="note" rows="3"></textarea>
</div>
<div style="display:flex;gap:10px;justify-content:flex-end">
<button type="button" class="btn" onclick="closeModal()">Отмена</button>
<button type="submit" class="btn btn-primary">Отправить</button>
</div>
</form>
</div>
</div>


<script>
function openModal(){
const m = document.getElementById('modal');
m.classList.add('open');
m.setAttribute('aria-hidden','false');
document.getElementById('name').focus();
}
function closeModal(){
const m = document.getElementById('modal');
m.classList.remove('open');
m.setAttribute('aria-hidden','true');
}
function submitForm(e){
e.preventDefault();
const name = document.getElementById('name').value.trim();
const contact = document.getElementById('contact').value.trim();
const note = document.getElementById('note').value.trim();
if(!name || !contact){alert('Пожалуйста, укажите имя и контакт.');return}
// Здесь можно подключить отправку на сервер — для демо просто покажем сообщение
alert('Спасибо, '+name+'! Я свяжусь с вами по ' + contact + ' в ближайшее время.');
closeModal();
document.getElementById('contactForm').reset();
}


// keyboard: Esc closes modal
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ closeModal(); } });


// smooth scroll for internal links
document.querySelectorAll('a[href^="#"]').forEach(a=>{
a.addEventListener('click', function(e){
const target = document.querySelector(this.getAttribute('href'));
if(target){e.preventDefault(); target.scrollIntoView({behavior:'smooth',block:'start'});}
});
});
</script>
</body>
</html>
